<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0a0a0a, #111827, #1f2937);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .gallery-item {
      aspect-ratio: 16 / 9;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .gallery-item:hover {
      transform: scale(1.03);
      border-color: #7c3aed;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .links-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 480px;
      margin: 0 auto;
    }

    .cf-link {
      height: 55px;
      background: rgba(124, 58, 237, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cf-link:hover {
      background: #7c3aed;
      border-color: #7c3aed;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
    }

    .cf-link svg {
      width: 24px;
      height: 24px;
      fill: #c4b5fd;
      transition: fill 0.2s ease;
    }

    .cf-link:hover svg {
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="gallery-grid">
      <div class="gallery-item"><img src="1.jpg" alt=""></div>
      <div class="gallery-item"><img src="2.jpg" alt=""></div>
      <div class="gallery-item"><img src="3.jpg" alt=""></div>
      <div class="gallery-item"><img src="4.jpg" alt=""></div>
      <div class="gallery-item"><img src="5.jpg" alt=""></div>
      <div class="gallery-item"><img src="6.jpg" alt=""></div>
      <div class="gallery-item"><img src="7.jpg" alt=""></div>
      <div class="gallery-item"><img src="8.jpg" alt=""></div>
      <div class="gallery-item"><img src="9.jpg" alt=""></div>
      <div class="gallery-item"><img src="10.jpg" alt=""></div>
      <div class="gallery-item"><img src="11.jpg" alt=""></div>
      <div class="gallery-item"><img src="12.jpg" alt=""></div>
    </div>

    <div class="links-container">
      <a href="https://www.curseforge.com/members/2xstudio/projects" target="_blank" class="cf-link">
        <svg viewBox="0 0 24 24">
          <path d="M19.54 11.08a.33.33 0 00-.22-.11h-3.41a.33.33 0 01-.22-.11L12.38 7.4a.33.33 0 00-.46 0L8.61 10.86a.33.33 0 01-.22.11H4.83a.33.33 0 00-.22.11l-3.3 4.14a.32.32 0 000 .4l10.23 9.07a.64.64 0 00.92 0l10.23-9.07a.32.32 0 000-.4zM12 1.35L5.73 6a.32.32 0 000 .5l1.6 1.18a.33.33 0 00.41 0L12 4.67l4.26 3.01a.33.33 0 00.41 0l1.6-1.18a.32.32 0 000-.5z"/>
        </svg>
      </a>
      <a href="https://www.curseforge.com/minecraft-bedrock/maps/zombie-attack" target="_blank" class="cf-link">
        <svg viewBox="0 0 24 24">
          <path d="M12 2A10 10 0 002 12a10 10 0 0010 10 10 10 0 0010-10A10 10 0 0012 2zm1 14.5h-2v-2h2v2zm0-3.5h-2V7h2v6z"/>
        </svg>
      </a>
    </div>
  </div>

</body>
</html>
